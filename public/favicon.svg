<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cafe Bloom">
  <title>Cafe Bloom</title>
  <defs>
    <linearGradient id="bloomBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0405f"/>
      <stop offset="0.55" stop-color="#a62648"/>
      <stop offset="1" stop-color="#6b1430"/>
    </linearGradient>
    <linearGradient id="bloomPetal" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6dde2"/>
    </linearGradient>
    <!-- One petal, reused five times. Deliberately a single simple curve so the
         silhouette still reads as a flower at 16px. -->
    <path id="bloomPetalShape"
          d="M32 9c6.6 7.4 8.6 15.1 4.9 21.2a8.6 8.6 0 0 1-9.8 0C23.4 24.1 25.4 16.4 32 9Z"/>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bloomBg)"/>

  <g fill="url(#bloomPetal)">
    <use href="#bloomPetalShape"/>
    <use href="#bloomPetalShape" transform="rotate(72 32 32)"/>
    <use href="#bloomPetalShape" transform="rotate(144 32 32)"/>
    <use href="#bloomPetalShape" transform="rotate(216 32 32)"/>
    <use href="#bloomPetalShape" transform="rotate(288 32 32)"/>
  </g>

  <circle cx="32" cy="32" r="6.2" fill="#b08a46"/>
  <circle cx="30.1" cy="30.1" r="2.1" fill="#e7cf9a"/>
</svg>
